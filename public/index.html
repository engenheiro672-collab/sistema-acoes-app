<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorteios Online</title>
    <link rel="stylesheet" href="/css/tailwind-estatico.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://code.jquery.com">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            background-color: #20242e;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }
        .card-destaque {
            background-color: #2a303c;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: transform 0.2s;
        }
        .card-destaque:hover { transform: translateY(-5px); }
        .card-destaque-title {
            color: #fff; font-weight: 600; font-size: 1.5rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .card-destaque-desc { color: #a0aec0; font-size: 1rem; }
        .btn-bilhetes {
            background-color: #7c3aed; color: white; border-radius: 20px;
            padding: 8px 20px; font-weight: 600; transition: background-color 0.2s;
        }
        .btn-bilhetes:hover { background-color: #6d28d9; }
        .card-small {
            display: flex; align-items: center; padding: 12px;
            background-color: #2a303c; border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2); overflow: hidden; transition: transform 0.2s;
        }
        .card-small:hover { transform: translateY(-5px); }
        .card-small img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .card-small-info { margin-left: 16px; overflow: hidden; }
        .card-small-title { color: #fff; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-small-desc { color: #a0aec0; font-size: 0.875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-small-badge {
            font-size: 0.7rem; padding: 2px 6px; border-radius: 6px; font-weight: 600;
            display: inline-block; margin-top: 4px; background-color: #4a5568; color: #e2e8f0;
        }
        .skeleton { background: linear-gradient(90deg,#2a303c 25%,#343c4a 37%,#2a303c 63%); background-size: 400% 100%; animation: skeleton 1.4s ease infinite; border-radius: 8px; }
        @keyframes skeleton { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    </style>
</head>
<body class="min-h-screen">

    <header class="bg-[#2a303c] shadow-lg sticky top-0 z-50">
        <nav class="container mx-auto max-w-6xl px-4 py-4 flex justify-between items-center">
            <div id="logo-box" class="text-2xl font-bold text-white">LOGO</div>
            <div>
                <button id="btn-meus-bilhetes" class="btn-bilhetes">
                    <i class="bi bi-ticket-detailed"></i> Meus Bilhetes
                </button>
            </div>
        </nav>
    </header>

    <main class="container mx-auto max-w-6xl p-4">

        <h2 class="text-2xl font-semibold mb-4 text-white">⚡ Campanhas</h2>

        <section id="sorteio-destaque" class="mb-8">
            <div class="skeleton h-64 w-full"></div>
        </section>

        <section id="outros-sorteios">
            <div id="lista-sorteios" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>

        <section id="ganhadores" class="mt-12">
            <h2 id="ganhadores-titulo" class="text-2xl font-semibold mb-4 text-white"></h2>
            <div id="lista-ganhadores" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </section>
    </main>

    <div id="modal-bilhetes" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 hidden">
        <div class="bg-[#2b2b2b] p-6 rounded-lg shadow-xl w-full max-w-lg mx-4">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold text-white">Consultar Meus Bilhetes</h3>
                <button id="close-modal-bilhetes" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <form id="form-meus-bilhetes">
                <label class="block text-sm mb-2 text-gray-300" for="phone-input">Digite seu telefone (com DDD):</label>
                <input id="phone-input" type="tel" class="w-full p-2 rounded bg-[#1a1a1a] text-white border border-gray-600" placeholder="(11) 99999-9999" required>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded mt-4">
                    Buscar
                </button>
            </form>
            <div id="resultado-bilhetes" class="mt-4 max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <script>
        function formatarMoeda(valor) { return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

        function injetarPixels(pixels) {
            if (!pixels) return;
            if (pixels.facebook_pixel_id) {
                !function(f,b,e,v,n,t,s)
                {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
                n.callMethod.apply(n,arguments):n.queue.push(arguments)};
                if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
                n.queue=[];t=b.createElement(e);t.async=!0;
                t.src=v;s=b.getElementsByTagName(e)[0];
                s.parentNode.insertBefore(t,s)}(window, document,'script',
                'https://connect.facebook.net/en_US/fbevents.js');
                fbq('init', pixels.facebook_pixel_id);
                fbq('track', 'PageView');
            }
            if (pixels.google_ads_id) {
                const s1 = document.createElement('script'); s1.async = true; s1.src = `https://www.googletagmanager.com/gtag/js?id=${pixels.google_ads_id}`;
                document.head.appendChild(s1);
                window.dataLayer = window.dataLayer || [];
                window.gtag = function(){ dataLayer.push(arguments); };
                gtag('js', new Date()); gtag('config', pixels.google_ads_id);
            }
            if (pixels.gtm_id) {
                (function (w, d, s, l, i) { w[l] = w[l] || []; w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' }); var f = d.getElementsByTagName(s)[0], j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f); })(window, document, 'script', 'dataLayer', pixels.gtm_id);
            }
        }

        function renderPagina(data) {
            const { sorteios = [], ganhadores = [], logo_url, pixels } = data;

            if (logo_url) {
                $('#logo-box').html(`<img src="${logo_url}" alt="Logo" class="h-8 inline-block">`);
            }
            injetarPixels(pixels);

            const destaque = sorteios.find(s => s.is_featured);
            const principal = destaque || (sorteios.length > 0 ? sorteios[0] : null);

            const $destaque = $('#sorteio-destaque');
            if (principal) {
                $destaque.html(`
                    <a href="/sorteio/${principal.slug}" class="block card-destaque">
                        <div class="relative">
                            <img src="${principal.foto_url || ''}" alt="${principal.nome}" class="w-full h-auto md:h-[450px] object-cover">
                        </div>
                        <div class="p-6">
                            <h3 class="card-destaque-title mb-2">${principal.nome}</h3>
                            <p class="card-destaque-desc">Participe e concorra! Cota por R$ ${Number(principal.preco_cota || 0).toFixed(2).replace('.', ',')}</p>
                        </div>
                    </a>
                `);
            } else {
                $destaque.html('<p class="text-center text-gray-400">Nenhum sorteio ativo no momento.</p>');
            }

            const outros = sorteios.filter(s => s !== principal);
            const $lista = $('#lista-sorteios');
            if (outros.length > 0) {
                $lista.html(outros.map(sorteio => {
                    const statusBadge = (sorteio.status === 'concluido')
                        ? `<span class="card-small-badge bg-red-600 text-white">Concluído</span>`
                        : `<span class="card-small-desc">Cota por R$ ${Number(sorteio.preco_cota || 0).toFixed(2).replace('.', ',')}</span>`;
                    return `
                        <a href="/sorteio/${sorteio.slug}" class="card-small">
                            <img src="${sorteio.foto_url || ''}" alt="${sorteio.nome}">
                            <div class="card-small-info">
                                <h4 class="card-small-title">${sorteio.nome}</h4>
                                ${statusBadge}
                            </div>
                        </a>
                    `;
                }).join(''));
            } else if (!principal) {
                $lista.html('<p class="col-span-full text-center text-gray-400">Nenhum outro sorteio para listar.</p>');
            }

            const $ganhadores = $('#lista-ganhadores');
            if (ganhadores && ganhadores.length > 0) {
                $('#ganhadores-titulo').text('🏆 Últimos Ganhadores');
                $ganhadores.html(ganhadores.map(sorteio => `
                    <a href="/sorteio/${sorteio.slug}" class="card-small">
                        <img src="https://placehold.co/80x80/555/fff?text=🏆" alt="Ganhador">
                        <div class="card-small-info">
                            <h4 class="card-small-title">${sorteio.ganhador_nome}</h4>
                            <p class="card-small-desc">Ganhou: ${sorteio.nome}</p>
                            <p class="text-xs text-gray-500">Cota: ${sorteio.ganhador_cota}</p>
                        </div>
                    </a>
                `).join(''));
            }
        }

        $(document).ready(function() {
            $.get('/api/public/inicio')
                .done(function(resp) { renderPagina(resp); })
                .fail(function() {
                    $('#sorteio-destaque').html('<p class="text-center text-red-400">Erro ao carregar sorteios. Tente novamente.</p>');
                });

            $('#btn-meus-bilhetes').on('click', function() { $('#modal-bilhetes').removeClass('hidden'); });
            $('#close-modal-bilhetes').on('click', function() { $('#modal-bilhetes').addClass('hidden'); });

            $('#form-meus-bilhetes').on('submit', function(e) {
                e.preventDefault();
                const telefone = $('#phone-input').val();
                const resultadoContainer = $('#resultado-bilhetes');
                resultadoContainer.html('<p class="text-center text-white">Buscando...</p>');

                $.ajax({
                    url: '/api/public/meus-bilhetes',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ telefone: telefone.replace(/\D/g, '') }),
                    success: function(pedidos) {
                        resultadoContainer.empty();
                        if (!pedidos || pedidos.length === 0) {
                            resultadoContainer.html('<p class="text-center text-yellow-400">Nenhum pedido pago encontrado para este telefone.</p>');
                            return;
                        }
                        pedidos.forEach(pedido => {
                            const cotasVisiveis = (pedido.cotas || []).slice(0, 5);
                            const cotasOcultas = (pedido.cotas || []).length - cotasVisiveis.length;
                            const cotasHtml = cotasVisiveis.map(cota => `<span class="inline-block bg-gray-700 px-2 py-1 rounded text-sm font-mono">${cota.numero_cota}</span>`).join(' ');
                            resultadoContainer.append(`
                                <div class="bg-[#2a303c] p-4 mb-4 rounded-lg">
                                    <h4 class="font-semibold text-white">${pedido.sorteios?.nome || ''}</h4>
                                    <p class="text-sm text-gray-300">${pedido.quantidade_cotas} cotas - ${formatarMoeda(pedido.valor_total)}</p>
                                    <div class="mt-4">
                                        <p class="text-sm text-gray-300 mb-2">Seus números:</p>
                                        <div class="flex flex-wrap gap-2">${cotasHtml}
                                            ${cotasOcultas > 0 ? `<span class="text-xs text-gray-500 ml-2">(e mais ${cotasOcultas} cotas)</span>` : ''}
                                        </div>
                                    </div>
                                </div>
                            `);
                        });
                    },
                    error: function(xhr) {
                        const errorMsg = xhr.responseJSON?.error || 'Erro ao buscar bilhetes. Tente novamente.';
                        resultadoContainer.html(`<p class="text-center text-red-400">${errorMsg}</p>`);
                    }
                });
            });
        });
    </script>

</body>
</html>
