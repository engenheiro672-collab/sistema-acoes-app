<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f1115; color: #e6edf3; font-family: 'Inter', sans-serif; }
        .login-box { background-color: #1a1d24; border: 1px solid #2a2f3a; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <div class="login-box w-full max-w-sm p-8 rounded-xl shadow-xl">
        <h1 class="text-2xl font-bold text-white mb-1 text-center">Painel Admin</h1>
        <p class="text-gray-400 text-sm text-center mb-6">Entre para gerenciar seus sorteios</p>
        <div id="login-error" class="text-red-400 text-sm mb-3 hidden"></div>
        <form id="form-login">
            <label class="block text-sm text-gray-400 mb-1">Email</label>
            <input id="login-email" type="email" required class="w-full p-2 rounded mb-4 bg-[#111827] border border-gray-700 text-white">
            <label class="block text-sm text-gray-400 mb-1">Senha</label>
            <input id="login-pass" type="password" required class="w-full p-2 rounded mb-6 bg-[#111827] border border-gray-700 text-white">
            <button type="submit" id="login-btn" class="w-full py-2 rounded font-semibold text-white" style="background: linear-gradient(135deg,#8b5cf6,#6d28d9);">Entrar</button>
        </form>
    </div>

    <script>
        document.getElementById('form-login').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pass').value;
            const $err = document.getElementById('login-error');
            $err.classList.add('hidden');
            const btn = document.getElementById('login-btn');
            btn.disabled = true; btn.textContent = 'Entrando...';
            try {
                const resp = await fetch('/88652715/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await resp.json();
                if (!resp.ok || data.status === 'error') {
                    $err.textContent = data.error || 'Erro ao entrar';
                    $err.classList.remove('hidden');
                    btn.disabled = false; btn.textContent = 'Entrar';
                    return;
                }
                window.location.href = data.redirect || '/88652715';
            } catch (err) {
                $err.textContent = 'Erro de conexão. Tente novamente.';
                $err.classList.remove('hidden');
                btn.disabled = false; btn.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
