<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">__OG_TITLE__</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="__OG_TITLE__">
    <meta property="og:image" content="__OG_IMAGE__">
    <link rel="preconnect" href="/">
    <style>
        /* ⚡ De propósito: SEM Google Fonts, SEM jQuery, SEM biblioteca nenhuma — essa é uma página
           de anúncio, precisa abrir fisicamente o mais rápido possível no clique. Fonte do sistema
           (zero espera de rede) e só JavaScript puro. */
        /* ⚡ Paleta idêntica à do sorteio.html/checkout.html (fundo azul-marinho #20242e, verde
           #1a8754→#22a866 no CTA principal, #1a8754→#5be584 nas barras de progresso) — pra ficar
           tudo combinando, sem cor nenhuma "solta" que não exista no resto do sistema. */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { background: #12141b; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; width: 100%; height: 100%; }
        /* ⚡ Cadeia progressiva de unidade de altura — vh (qualquer navegador) → svh (altura
           "garantida", ignora barra de endereço) → dvh (altura real dinâmica, o valor mais preciso
           em celulares grandes/iOS). O navegador sempre usa a última que ele entender, então a tela
           fecha certinho no tamanho exato daquele aparelho, sem sobrar nem faltar pixel embaixo. */
        html, body, .tela { height: 100vh; height: 100svh; height: 100dvh; }
        .tela { position: relative; width: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; background: #12141b; }

        /* ═══════════════ TELA 1 — CARREGANDO (abre instantâneo) ═══════════════ */
        #tela-carregando { position: fixed; inset: 0; z-index: 100; background-color: #20242e; background-size: cover; background-position: center; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.4s ease; }
        #tela-carregando::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,18,26,0.4) 0%, rgba(10,12,18,0.6) 100%); }
        #tela-carregando.saindo { opacity: 0; pointer-events: none; }

        .spinner-carregamento { width: 42px; height: 42px; border: 3px solid rgba(255,255,255,0.25); border-top-color: #5be584; border-radius: 50%; animation: girar 0.8s linear infinite; position: relative; z-index: 2; }
        @keyframes girar { to { transform: rotate(360deg); } }

        #txt-carregando { position: relative; z-index: 2; margin-top: 1rem; font-size: 0.95rem; font-weight: 700; color: #fff; letter-spacing: 0.02em; }

        .barra-carregamento-wrap { position: relative; z-index: 2; width: 62%; margin-top: 0.9rem; height: 5px; border-radius: 999px; background: rgba(255,255,255,0.18); overflow: hidden; }
        #barra-carregamento { height: 100%; width: 0%; background: linear-gradient(90deg, #1a8754, #5be584); box-shadow: 0 0 10px rgba(26,135,84,0.6); transition: width 0.25s ease; }

        /* ═══════════════ TELA 2 — PRÉ-VENDA ═══════════════ */
        #tela-prevenda { position: relative; width: 100%; height: 100%; background: #12141b; opacity: 0; transition: opacity 0.5s ease; }
        #tela-prevenda.visivel { opacity: 1; }

        /* ⚡ object-fit:cover nunca deixa "buraco" — sempre corta o vídeo pra preencher a caixa
           inteira. O fundo escuro aqui é só uma segunda garantia: se o vídeo ainda não tiver o
           primeiro frame pintado (rede lenta), aparece essa cor — nunca branco. */
        #video-fundo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #12141b; }

        /* Gradiente de cima: só pra dar leitura no nome do sorteio.
           Gradiente de baixo: mais alto e chegando 100% opaco na borda inferior — é ele que "funde"
           o vídeo com o cartão, e garante que a última fileira de pixels é sempre a cor sólida do
           sistema, nunca uma quebra seca ou uma tira clara aparecendo. */
        .overlay-degrade-topo { position: absolute; top: 0; left: 0; right: 0; height: 150px; background: linear-gradient(180deg, rgba(10,12,18,0.6) 0%, rgba(10,12,18,0) 100%); z-index: 2; pointer-events: none; }
        .overlay-degrade-base { position: absolute; bottom: 0; left: 0; right: 0; height: 320px; background: linear-gradient(0deg, #0d0f14 0%, rgba(13,15,20,0.92) 30%, rgba(13,15,20,0) 100%); z-index: 2; pointer-events: none; }

        /* Botão "Tocar com som" — só o ícone (alto-falante com risco vermelho, sem fundo) e o
           texto embaixo, sem pílula nem fundo nenhum, igual a referência que o cliente mandou. */
        #btn-tocar-som { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 5; background: none; border: none; color: #fff; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; cursor: pointer; opacity: 0.55; animation: pulsar-som 1.6s ease-in-out infinite; }
        #btn-tocar-som svg { width: 34px; height: 34px; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)); }
        #btn-tocar-som span { font-weight: 700; font-size: 0.85rem; letter-spacing: 0.03em; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
        @keyframes pulsar-som { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.55; } 50% { transform: translate(-50%, -50%) scale(1.08); opacity: 0.8; } }
        #btn-tocar-som.escondido { display: none; }

        /* Nome do sorteio + descriçãozinha embaixo, ambos num tom mais suave (não 100% branco
           sólido) pra não competir com o vídeo. */
        #box-nome-sorteio { position: absolute; top: 1.1rem; left: 1rem; right: 1rem; z-index: 3; }
        #nome-sorteio-prevenda { font-size: 1.2rem; font-weight: 800; color: rgba(255,255,255,0.9); text-shadow: 0 2px 10px rgba(0,0,0,0.6); line-height: 1.25; }
        #descricao-sorteio-prevenda { margin-top: 0.25rem; font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.68); text-shadow: 0 1px 6px rgba(0,0,0,0.5); }

        /* Cartão inferior */
        #card-inferior-prevenda { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 1rem 1rem 1.3rem; }

        .box-percentual-vendidos { margin-bottom: 0.8rem; }
        .linha-percentual-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 0.75rem; font-weight: 600; color: #e2e8f0; margin-bottom: 0.35rem; }
        .linha-percentual-label b { color: #5be584; font-size: 0.82rem; }
        .trilho-percentual { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.18); overflow: hidden; }
        #barra-percentual-vendidos { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #1a8754, #5be584); transition: width 1.1s cubic-bezier(0.22, 1, 0.36, 1); }

        #btn-participar-agora { display: block; width: 100%; text-align: center; background: linear-gradient(135deg, #1a8754, #22a866); color: #fff; font-weight: 800; font-size: 1.05rem; padding: 0.95rem; border-radius: 12px; border: none; box-shadow: 0 8px 22px rgba(26,135,84,0.4); cursor: pointer; letter-spacing: 0.02em; text-transform: uppercase; }
        #btn-participar-agora:active { transform: scale(0.98); }

        .selos-confianca-prevenda { display: flex; gap: 0.6rem; justify-content: center; margin-top: 0.65rem; }
        .selo-confianca-prevenda { display: flex; align-items: center; gap: 0.3rem; font-size: 0.68rem; font-weight: 600; color: rgba(255,255,255,0.75); }
        .selo-confianca-prevenda svg { width: 13px; height: 13px; flex-shrink: 0; }

        /* Marca — agora no rodapé do cartão, abaixo dos selos */
        #rodape-marca-prevenda { display: flex; align-items: center; gap: 9px; margin-top: 0.9rem; padding-top: 0.85rem; border-top: 1px solid rgba(255,255,255,0.12); }
        #marca-prevenda-foto { width: 34px; height: 34px; border-radius: 50%; background-color: #12141b; background-size: cover; background-position: center; border: 2px solid #1a8754; flex-shrink: 0; }
        #marca-prevenda-textos { line-height: 1.3; }
        #marca-prevenda-nome { font-size: 0.8rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 4px; }
        #marca-prevenda-descricao { font-size: 0.7rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="tela">

        <!-- TELA 1: CARREGANDO -->
        <div id="tela-carregando">
            <div class="spinner-carregamento"></div>
            <p id="txt-carregando">Carregando...</p>
            <div class="barra-carregamento-wrap"><div id="barra-carregamento"></div></div>
        </div>

        <!-- TELA 2: PRÉ-VENDA -->
        <div id="tela-prevenda">
            <video id="video-fundo" muted loop playsinline autoplay></video>
            <div class="overlay-degrade-topo"></div>
            <div class="overlay-degrade-base"></div>

            <button type="button" id="btn-tocar-som" onclick="ativarSom()">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="#fff"/><line x1="2.5" y1="2.5" x2="21.5" y2="21.5" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round"/></svg>
                <span>Tocar com som</span>
            </button>

            <div id="box-nome-sorteio">
                <div id="nome-sorteio-prevenda"></div>
                <div id="descricao-sorteio-prevenda"></div>
            </div>

            <div id="card-inferior-prevenda">
                <div class="box-percentual-vendidos">
                    <div class="linha-percentual-label"><span>Vendidos</span><b id="txt-percentual-vendidos">0%</b></div>
                    <div class="trilho-percentual"><div id="barra-percentual-vendidos"></div></div>
                </div>

                <button type="button" id="btn-participar-agora" onclick="participarAgora()">Participe Agora!</button>

                <div class="selos-confianca-prevenda">
                    <span class="selo-confianca-prevenda"><svg viewBox="0 0 24 24" fill="#facc15"><path d="M12 1a5 5 0 0 0-5 5v3H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10a1 1 0 0 0-1-1h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3zm0 10a1.6 1.6 0 0 1 1 2.86V17.5a1 1 0 1 1-2 0v-1.64A1.6 1.6 0 0 1 12 13z"/></svg>Ambiente seguro</span>
                    <span class="selo-confianca-prevenda"><svg viewBox="0 0 24 24" fill="#5be584"><path d="M9 16.2l-3.5-3.5L4 14.2 9 19.2 20 8.2l-1.5-1.5z"/></svg>Resultados reais</span>
                </div>

                <div id="rodape-marca-prevenda">
                    <div id="marca-prevenda-foto"></div>
                    <div id="marca-prevenda-textos">
                        <div id="marca-prevenda-nome">
                            <span id="marca-prevenda-nome-texto"></span>
                            <svg viewBox="0 0 24 24" fill="#22c55e" width="12" height="12"><path d="M12 1l2.6 2.4 3.5-.6.9 3.4 3.4.9-.6 3.5L24 13l-2.4 2.6.6 3.5-3.4.9-.9 3.4-3.5-.6L12 25l-2.6-2.4-3.5.6-.9-3.4-3.4-.9.6-3.5L0 13l2.4-2.6-.6-3.5 3.4-.9.9-3.4 3.5.6L12 1zm-1.2 15.4l6.4-6.4-1.4-1.4-5 5-2.4-2.4-1.4 1.4 3.8 3.8z"/></svg>
                        </div>
                        <div id="marca-prevenda-descricao"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var DADOS = window.__DADOS_INICIAIS__ || {};
        var prevenda = DADOS.prevenda || {};
        var sorteio = DADOS.sorteio || {};

        // ────────────────────────────────────────────────────────────────────
        // Preenche a Tela 1 (fundo + textos) com o que já veio no HTML — sem
        // nenhuma requisição extra, aparece junto com a primeira pintura da página.
        // ────────────────────────────────────────────────────────────────────
        if (prevenda.imagem_capa_url) {
            document.getElementById('tela-carregando').style.backgroundImage = "url('" + prevenda.imagem_capa_url + "')";
        }

        // Preenche a Tela 2 (fica pronta escondida, atrás da Tela 1)
        document.getElementById('nome-sorteio-prevenda').textContent = sorteio.nome || '';
        document.getElementById('descricao-sorteio-prevenda').textContent = 'Participe e concorra';
        document.getElementById('marca-prevenda-nome-texto').textContent = sorteio.marca_nome || 'Prêmios Derrets';
        document.getElementById('marca-prevenda-descricao').textContent = sorteio.marca_descricao || 'Participe e concorra de verdade';
        // ⚡ Mesma regra do checkout: se não tiver foto própria configurada em "Marca do checkout",
        // usa a foto do próprio sorteio (a mesma que já vem carregada nesses dados) — nunca fica
        // sem imagem nenhuma no rodapé.
        var fotoMarca = sorteio.marca_foto_url || sorteio.foto_url || '';
        if (fotoMarca) {
            document.getElementById('marca-prevenda-foto').style.backgroundImage = "url('" + fotoMarca + "')";
        }
        var percentual = Math.max(0, Math.min(100, Number(sorteio.percentual_vendido || 0)));
        // ⚡ Mostra a casa decimal sempre que ela existir de verdade (52.7 → "52.7%"), só arredonda
        // pra número inteiro quando o valor configurado já é redondo (73 → "73%").
        var percentualTexto = (percentual % 1 !== 0) ? percentual.toFixed(1) : Math.round(percentual);
        document.getElementById('txt-percentual-vendidos').textContent = percentualTexto + '%';
        // ⚡ Esse era o bug: só o texto era preenchido, a largura da barra nunca era setada e ficava
        // travada no 0% do CSS. Agora os dois andam juntos.
        document.getElementById('barra-percentual-vendidos').style.width = percentual + '%';

        var video = document.getElementById('video-fundo');
        if (prevenda.video_url) video.src = prevenda.video_url;

        // URL de destino ao clicar em "Participe Agora!" — já pré-carregada durante a Tela 1.
        var urlDestino = sorteio.slug ? ('/sorteio/' + sorteio.slug + (DADOS.funilSlug ? '/' + DADOS.funilSlug : '')) : '/';

        function participarAgora() {
            if (prevenda.id) {
                try {
                    var payload = JSON.stringify({ prevenda_id: prevenda.id });
                    if (navigator.sendBeacon) navigator.sendBeacon('/api/public/prevenda/avancou-site', new Blob([payload], { type: 'application/json' }));
                } catch (e) {}
            }
            window.location.href = urlDestino;
        }

        function ativarSom() {
            video.muted = false;
            video.play().catch(function () {});
            document.getElementById('btn-tocar-som').classList.add('escondido');
        }

        // ────────────────────────────────────────────────────────────────────
        // Enquanto a Tela 1 aparece, pré-carrega em paralelo: (1) o vídeo de fundo real e
        // (2) a página de destino (sorteio.html) — assim, quando a pessoa clicar em
        // "Participe Agora!", a transição é praticamente instantânea.
        // ────────────────────────────────────────────────────────────────────
        var progressoBarra = 0;
        var videoPronto = !prevenda.video_url;
        var paginaPronta = false;
        var TEMPO_MINIMO_MS = 900;   // pra não "piscar" em conexões muito rápidas
        var TEMPO_MAXIMO_MS = 4500;  // trava de segurança: nunca deixa a pessoa presa na Tela 1
        var inicioEm = Date.now();
        var jaTrocouDeTela = false;

        function avancarBarra(alvo) {
            progressoBarra = Math.max(progressoBarra, alvo);
            document.getElementById('barra-carregamento').style.width = progressoBarra + '%';
        }

        function tentarTrocarDeTela() {
            var decorrido = Date.now() - inicioEm;
            var tudoPronto = videoPronto && paginaPronta;
            if (jaTrocouDeTela) return;
            if ((tudoPronto && decorrido >= TEMPO_MINIMO_MS) || decorrido >= TEMPO_MAXIMO_MS) {
                jaTrocouDeTela = true;
                avancarBarra(100);
                setTimeout(function () {
                    document.getElementById('tela-carregando').classList.add('saindo');
                    document.getElementById('tela-prevenda').classList.add('visivel');
                    video.muted = true;
                    video.play().catch(function () {});
                    setTimeout(function () { document.getElementById('tela-carregando').style.display = 'none'; }, 450);
                }, 120);
            }
        }

        // Pré-carrega o vídeo real
        if (prevenda.video_url) {
            avancarBarra(15);
            video.addEventListener('loadeddata', function () { avancarBarra(70); videoPronto = true; tentarTrocarDeTela(); });
            video.addEventListener('canplaythrough', function () { avancarBarra(90); videoPronto = true; tentarTrocarDeTela(); });
            video.addEventListener('error', function () { videoPronto = true; tentarTrocarDeTela(); }); // não trava a pessoa se o link falhar
            video.load();
        } else {
            avancarBarra(50);
        }

        // Pré-carrega a página de destino (sorteio.html) em paralelo, via <link rel="prefetch">
        // — o navegador baixa e guarda em cache, então a navegação real depois é imediata.
        try {
            var linkPrefetch = document.createElement('link');
            linkPrefetch.rel = 'prefetch';
            linkPrefetch.as = 'document';
            linkPrefetch.href = urlDestino;
            document.head.appendChild(linkPrefetch);
        } catch (e) {}
        fetch(urlDestino, { credentials: 'omit' }).then(function () {
            paginaPronta = true; avancarBarra(95); tentarTrocarDeTela();
        }).catch(function () {
            paginaPronta = true; tentarTrocarDeTela();
        });

        // Trava de segurança final, independente de tudo (se algo travou silenciosamente).
        setTimeout(tentarTrocarDeTela, TEMPO_MAXIMO_MS);
        // Checagem periódica leve, caso os dois eventos já tenham disparado antes dos listeners.
        var checagem = setInterval(function () {
            tentarTrocarDeTela();
            if (jaTrocouDeTela) clearInterval(checagem);
        }, 200);
    </script>
</body>
</html>
