<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">__OG_TITLE__</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="__OG_TITLE__">
    <meta property="og:image" content="__OG_IMAGE__">
    <link rel="preconnect" href="/">
    <style>
        /* ⚡ De propósito: a página mais leve possível do sistema inteiro — sem Google Fonts, sem
           jQuery, sem carrossel, sem vídeo, sem confete. Só uma foto, um botão, e duas perguntas
           simples. É pensada pra servir de "porta de entrada" limpa, antes do site principal (que
           é mais pesado e tem mais risco de restrição). */
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: #20242e; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; }
        .tela { position: relative; width: 100%; max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }

        .foto-box { width: 100%; max-width: 340px; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.4); background: #111; }
        .foto-box img { display: block; width: 100%; height: auto; }

        .btn-avancar { margin-top: 1.6rem; width: 100%; max-width: 340px; background: linear-gradient(135deg, #1a8754, #22a866); color: #fff; font-weight: 800; font-size: 1.05rem; padding: 1rem; border-radius: 12px; border: none; box-shadow: 0 10px 28px rgba(26,135,84,0.4); cursor: pointer; animation: pulsarBotao 1.4s ease-in-out infinite; }
        @keyframes pulsarBotao { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        /* Overlay padrão — fundo com leve desfoque, mesmo estilo já usado no resto do sistema */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(10,14,20,0.5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); align-items: center; justify-content: center; z-index: 9999; padding: 1rem; }
        .overlay.visivel { display: flex; }
        .card { background: linear-gradient(160deg, rgba(42,48,62,0.9), rgba(18,22,30,0.95)); border-radius: 12px; padding: 1.8rem 1.6rem; max-width: 320px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15); }
        .card p { font-size: 1.05rem; font-weight: 800; margin: 0 0 1.2rem; color: #fff; }
        .card .opcoes { display: flex; gap: 0.7rem; }
        .card button { flex: 1; padding: 0.75rem; border-radius: 8px; border: none; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
        .btn-sim { background: linear-gradient(135deg, #1a8754, #22a866); color: #fff; }
        .btn-nao { background: rgba(255,255,255,0.08); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.15) !important; }
        .card input { width: 100%; padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.06); color: #fff; font-size: 0.95rem; margin-bottom: 1rem; box-sizing: border-box; }
        .card input::placeholder { color: rgba(255,255,255,0.4); }
        .btn-confirmar { width: 100%; background: linear-gradient(135deg,#1a8754,#22a866); color: #fff; }
    </style>
</head>
<body>
    <div class="tela">
        <div class="foto-box" id="foto-box">
            <img id="foto-sorteio" src="__OG_IMAGE__" alt="">
        </div>
        <button class="btn-avancar" id="btn-avancar">Avançar</button>
    </div>

    <!-- Pergunta 1: você mora aqui? -->
    <div class="overlay" id="overlay-pergunta">
        <div class="card">
            <p id="txt-pergunta">Você mora nessa cidade?</p>
            <div class="opcoes">
                <button class="btn-nao" id="btn-nao">Não</button>
                <button class="btn-sim" id="btn-sim">Sim</button>
            </div>
        </div>
    </div>

    <!-- Pergunta 2 (só se responder "Não"): qual é a sua cidade? -->
    <div class="overlay" id="overlay-digitar-cidade">
        <div class="card">
            <p>Qual é a sua cidade?</p>
            <input type="text" id="input-cidade" placeholder="Digite sua cidade" maxlength="60">
            <button class="btn-confirmar" id="btn-confirmar-cidade">Confirmar</button>
        </div>
    </div>

    <script>
    (function () {
        var DADOS = window.__DADOS_INICIAIS__ || {};
        var sorteio = DADOS.sorteio || {};
        var prevenda = DADOS.prevenda || {};
        var cidadeConfigurada = prevenda.cidade || '';
        var funilSlug = DADOS.funilSlug || null;

        document.getElementById('txt-pergunta').textContent = cidadeConfigurada ? ('Você mora em ' + cidadeConfigurada + '?') : 'Você mora nessa cidade?';
        document.title = sorteio.nome || 'Sorteio';

        // ── Guarda o fbclid (e outros parâmetros de anúncio) pra levar adiante ──
        try {
            var params = new URLSearchParams(location.search);
            var fbclidUrl = params.get('fbclid');
            if (fbclidUrl) localStorage.setItem('fbclid_salvo', fbclidUrl);
            if (prevenda.id) sessionStorage.setItem('prevenda_id_atual', prevenda.id);
        } catch (e) {}

        // ── Pixel: PageView aqui, nunca de novo no site de destino ──────────
        var pixels = DADOS.pixels || {};
        if (pixels.facebook_pixel_id) {
            !function (f, b, e, v, n, t, s) {
                if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments) };
                if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];
                t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s);
            }(window, document, 'script', 'https://connect.facebook.net/en_US/fbevents.js');
            fbq('init', pixels.facebook_pixel_id);
            (pixels.facebook_pixel_ids_extras || []).forEach(function (id) { if (id && id !== pixels.facebook_pixel_id) fbq('init', id); });
            var jaDisparouPageView = false;
            try { jaDisparouPageView = sessionStorage.getItem('pageview_disparado') === '1'; } catch (e) {}
            if (!jaDisparouPageView) {
                fbq('track', 'PageView');
                try { sessionStorage.setItem('pageview_disparado', '1'); } catch (e) {}
            }
        }

        // ── Pré-carregamento do site de destino ─────────────────────────────
        // ⚡ De propósito, SEM ?cidade= na URL pré-carregada — a página de destino já sabe ler a
        // cidade certa via sessionStorage (que a gente ajusta certinho logo abaixo, seja qual for
        // a resposta da pessoa). Assim, o MESMO html pré-carregado serve tanto pra quem confirma
        // a cidade configurada quanto pra quem digita uma cidade diferente.
        var urlDestino = funilSlug && sorteio.slug
            ? '/sorteio/' + encodeURIComponent(sorteio.slug) + '/' + encodeURIComponent(funilSlug)
            : (sorteio.slug ? '/sorteio/' + encodeURIComponent(sorteio.slug) : '/');
        var htmlDestinoPronto = null;
        function iniciarPreCarregamentoDestino() {
            fetch(urlDestino, { credentials: 'same-origin' })
                .then(function (r) { return r.ok ? r.text() : null; })
                .then(function (html) { if (html) htmlDestinoPronto = html; })
                .catch(function () {});
        }
        if (document.readyState === 'complete') {
            setTimeout(iniciarPreCarregamentoDestino, 500);
        } else {
            window.addEventListener('load', function () { setTimeout(iniciarPreCarregamentoDestino, 500); });
        }

        function irParaDestino() {
            if (prevenda.id) {
                var corpo = JSON.stringify({ prevenda_id: prevenda.id });
                if (navigator.sendBeacon) {
                    navigator.sendBeacon('/api/public/prevenda/avancou-site', new Blob([corpo], { type: 'application/json' }));
                } else {
                    fetch('/api/public/prevenda/avancou-site', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: corpo, keepalive: true }).catch(function () {});
                }
            }
            if (htmlDestinoPronto) {
                try {
                    history.pushState(null, '', urlDestino);
                    document.open();
                    document.write(htmlDestinoPronto);
                    document.close();
                    return;
                } catch (e) { /* se algo der errado, cai pro caminho normal abaixo */ }
            }
            window.location.href = urlDestino;
        }

        function responderPergunta(resposta) {
            document.getElementById('overlay-pergunta').classList.remove('visivel');
            if (prevenda.id) {
                fetch('/api/public/prevenda/resposta-cidade', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prevenda_id: prevenda.id, resposta: resposta })
                }).catch(function () {});
            }
            if (resposta === 'sim') {
                try { if (cidadeConfigurada) sessionStorage.setItem('cidade_prevenda', cidadeConfigurada); } catch (e) {}
                irParaDestino();
            } else {
                document.getElementById('overlay-digitar-cidade').classList.add('visivel');
            }
        }

        document.getElementById('btn-avancar').addEventListener('click', function () {
            document.getElementById('overlay-pergunta').classList.add('visivel');
        });
        document.getElementById('btn-sim').addEventListener('click', function () { responderPergunta('sim'); });
        document.getElementById('btn-nao').addEventListener('click', function () { responderPergunta('nao'); });
        document.getElementById('btn-confirmar-cidade').addEventListener('click', function () {
            var novaCidade = (document.getElementById('input-cidade').value || '').trim();
            if (!novaCidade) return;
            try { sessionStorage.setItem('cidade_prevenda', novaCidade); } catch (e) {}
            document.getElementById('overlay-digitar-cidade').classList.remove('visivel');
            irParaDestino();
        });
    })();
    </script>
</body>
</html>
